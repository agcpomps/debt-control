version: "2"

sql:
  - schema: "sql/schema.sql"
    queries: "sql/queries.sql"
    engine: "postgresql"
    gen:
      go:
        package: "db"
        out: "internal/db"
        sql_package: "database/sql"
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"